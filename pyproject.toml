[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-ziwei"
version = "0.1.0"
description = "Psychological Zi Wei Dou Shu astrology SaaS platform"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # Validation
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    # AI
    "anthropic>=0.28.0",
    # Cache / Queue
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "lunardate>=0.2.0",
    "iztro-py>=0.3.4",
    # Payments
    "stripe>=15.0.0",
    # PDF
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tech_ziwei"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tech_ziwei"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/tech_ziwei --cov-report=term-missing"

[tool.coverage.run]
source = ["src/tech_ziwei"]
omit = ["*/migrations/*"]
